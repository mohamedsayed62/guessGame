<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>خمّن الكلمة</title>
  </head>
  <body>
    <h1>خمّن الكلمة</h1>
    <div class="guess-game">
      <div class="guess-word">
        <div class="inputs"></div>
        <div class="btns">
          <button class="btn check">تحقق من الكلمة</button>
          <button class="btn hint"></button>
        </div>
      </div>
      <div class="keys">
        <h2>ألوان المفاتيح</h2>
        <div class="key">
          <div class="key-color right"></div>
          <div class="key-text">الحرف صحيح وفي مكانه</div>
        </div>
        <div class="key">
          <div class="key-color not-in-place"></div>
          <div class="key-text">الحرف صحيح وليس في مكانه</div>
        </div>
        <div class="key">
          <div class="key-color wrong"></div>
          <div class="key-text">الحرف خاطئ وغير موجود في الكلمة</div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
